version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.14"
  jobs:
    create_environment:
      - curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.84.2 bash
      - '"$HOME/.pixi/bin/pixi" install --locked --environment docs'
    build:
      html:
        - '"$HOME/.pixi/bin/pixi" run --frozen --environment docs build-docs html "$READTHEDOCS_OUTPUT"'
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/htmlzip"
      - cd "$READTHEDOCS_OUTPUT/html" && zip -r ../htmlzip/grid-apps-docs.zip .
